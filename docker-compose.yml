
services:
  # ── Base de datos principal ──────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: ventabot_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ventabot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ventabot_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ventabot_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ventabot"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis (cache + queue) ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ventabot_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Backend FastAPI ──────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ventabot_api
    restart: unless-stopped
    env_file: .env.development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Celery Worker (follow-ups + tareas async) ───────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ventabot_worker
    restart: unless-stopped
    env_file: .env.development
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4

  # ── Celery Beat (scheduler de follow-ups) ───────────────────────
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ventabot_beat
    restart: unless-stopped
    env_file: .env.development
    volumes:
      - ./backend:/app
    depends_on:
      - redis
    command: celery -A app.workers.celery_app beat --loglevel=info

  # ── Frontend Next.js ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ventabot_frontend
    restart: unless-stopped
    env_file: .env.development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
